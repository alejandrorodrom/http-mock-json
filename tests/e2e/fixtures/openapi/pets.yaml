openapi: 3.0.3
info:
  title: Pets API
  version: 1.0.0
servers:
  - url: https://example.com/api/v1
paths:
  /pets:
    get:
      tags: [pets]
      summary: List pets
      responses:
        '200':
          description: OK
          content:
            application/json:
              example:
                pets:
                  - id: 1
                    name: doggie
        '500':
          description: Server error
          content:
            application/json:
              example:
                message: boom
    post:
      tags: [pets]
      summary: Create pet
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [id, name]
                properties:
                  id:
                    type: integer
                  name:
                    type: string
        '400':
          description: Bad request
          content:
            application/json:
              example:
                message: invalid
  /pets/{petId}:
    get:
      tags: [pets]
      summary: Get pet
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              example:
                id: 1
                name: doggie
        '404':
          description: Not found
          content:
            application/json:
              example:
                message: Pet not found
    head:
      tags: [pets]
      summary: Unsupported method fixture
      responses:
        '200':
          description: OK
  /store/inventory:
    get:
      tags: [store]
      summary: Inventory
      responses:
        '200':
          description: OK
          content:
            application/json:
              example:
                available: 10
  /items/{item-id}:
    get:
      tags: [pets]
      summary: Path param with hyphen (allowed)
      parameters:
        - name: item-id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              example:
                ok: true
  /items/{item.id}:
    get:
      tags: [pets]
      summary: Invalid path for http-mock-json (dot in param name)
      parameters:
        - name: item.id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              example:
                ok: true
